name: Publish GRPR site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage HTML from repo root
        run: |
          set -euo pipefail
          mkdir -p /tmp/site/css /tmp/site/js
          cp -a *.html /tmp/site/
          cp -a css/. /tmp/site/css/
          cp -a js/. /tmp/site/js/
          touch /tmp/site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site
          publish_branch: gh-pages
