<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRIDS: The Texas Advantage</title>
  <meta name="description" content="Gray Reed GRIDS: The Texas Advantage. Where data centers meet Texas.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/gray-reed-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap">
  <link rel="stylesheet" href="css/grids-tx.css">
</head>
<body>
  <header class="gr-head">
    <div class="wrap">
      <a class="logo" href="https://www.grayreed.com/" target="_blank" rel="noopener" aria-label="Gray Reed"><img src="assets/gray-reed-logo.png" alt="Gray Reed"></a>
      <nav class="topnav" id="grids-nav" aria-label="Primary">
        <a class="tx" href="https://www.grayreed.com/Our-People" target="_blank" rel="noopener">People</a>
        <a class="tx" href="https://www.grayreed.com/Practices" target="_blank" rel="noopener">Practices</a>
        <a class="tx" href="https://www.grayreed.com/Industries" target="_blank" rel="noopener">Industries</a>
      </nav>
      <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>
  <main id="app"></main>
  <footer>
    <div class="wrap">
      <span>© 2026 Gray Reed. All rights reserved worldwide.</span>
      <nav aria-label="Footer"><a href="https://www.grayreed.com/Online-Bill-Pay" target="_blank" rel="noopener">Online Bill Pay</a><a href="https://www.grayreed.com/Site-Map" target="_blank" rel="noopener">Sitemap</a><a href="https://www.grayreed.com/Disclaimer" target="_blank" rel="noopener">Disclaimer</a><a href="https://www.grayreed.com/Privacy-Policy" target="_blank" rel="noopener">Privacy Policy</a><a href="https://www.grayreed.com/Privacy-Policy" target="_blank" rel="noopener">Do Not Sell or Share My Personal Information</a></nav>
    </div>
  </footer>
  <!-- Pastel: paste the Gray Reed review snippet here when the project ID is ready. Do not add it to the GRPR repo. -->
  <script type="module" src="js/grids-tx.js"></script>
<script>
(function () {
  var btn = document.querySelector('.menu-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var open = document.body.classList.toggle('nav-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.querySelectorAll('.topnav a').forEach(function (a) {
    a.addEventListener('click', function () {
      document.body.classList.remove('nav-open');
      btn.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
</body>
</html>
